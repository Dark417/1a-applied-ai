# Local end-to-end run: `docker compose -f deploy/docker-compose.yaml up --build` from the project root.
services:
  backend:
    build: ../backend
    env_file: ../backend/.env
    expose: ["8000"]

  frontend:
    build: ../frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["4200:8080"]
    depends_on: [backend]
