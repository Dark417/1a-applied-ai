[project]
name = "ai-sdk-backend"
version = "0.1.0"
description = "One FastAPI entrance for ADK, LangGraph, Strands, and Claude agents on raw, Bedrock, and Vertex"
requires-python = ">=3.11"
dependencies = [
    # --- entrance ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
    "aiosqlite>=0.20",
    # --- frameworks ---
    "google-adk[extensions]>=2.9,<3",              # ADK 2: agents, Workflow graph, LiteLlm, AnthropicLlm
    "langgraph>=1.0",
    "langchain>=1.0",                               # create_agent + middleware
    "langchain-anthropic>=1.0",
    "langchain-google-genai>=2.0",
    "langchain-google-vertexai>=2.0",
    "langchain-aws>=1.0",
    "langchain-mcp-adapters>=0.3",
    "langgraph-checkpoint-sqlite>=3.0",
    "langgraph-checkpoint-aws>=1.2",               # AgentCoreMemorySaver / Store, BedrockSessionSaver
    "strands-agents[otel]>=1.10",                   # its [anthropic] extra pins anthropic<1; we install anthropic directly
    "strands-agents-tools>=0.2",
    "claude-agent-sdk>=0.2",
    "anthropic[bedrock,vertex]>=1.0",
    # --- MCP: langchain-mcp-adapters 0.3 does not support mcp 2.x yet ---
    "mcp>=1.23,<2",
    # --- cloud ---
    "boto3>=1.40",
    "bedrock-agentcore>=1.0",                       # Memory, Browser, Code Interpreter, Runtime
    "google-cloud-aiplatform[agent_engines]>=1.110",  # Vertex RAG Engine, Agent Engine, eval
    "google-cloud-modelarmor>=0.2",
    # --- tools ---
    "playwright>=1.48",
    # --- observability ---
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp>=1.30",
    "opentelemetry-exporter-gcp-trace>=1.9",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "openinference-instrumentation-langchain>=0.1.40",
    "openinference-instrumentation-anthropic>=0.1.18",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# `ruff format` owns line length; long prompt strings and docstrings are allowed.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are designed to be used as defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "eval: calls real models; needs ANTHROPIC_API_KEY / GOOGLE_API_KEY or cloud credentials",
    "browser: launches Chromium (PLAYWRIGHT_CHROMIUM_PATH)",
]
addopts = "-m 'not eval'"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
