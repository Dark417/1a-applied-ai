# Local stack: backend + Valkey (cache server) + OpenTelemetry Collector + Jaeger.
#   docker compose -f deploy/docker-compose.yaml up --build
#   playground  http://localhost:8000      traces  http://localhost:16686
services:
  backend:
    build: ../backend
    env_file:
      - path: ../backend/.env
        required: false  # keys come from here; compose still validates without it
    environment:
      OTEL_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      DATA_DIR: /app/data/generated
      REDIS_URL: redis://valkey:6379/0   # distributed session lock, registry, DIY caches
    ports: ["8000:8000"]
    volumes: ["backend-data:/app/data/generated"]
    depends_on: [otel-collector, valkey]

  # Cache server. Valkey is the Redis-protocol fork that ElastiCache and Memorystore offer;
  # `image: redis:7` works the same.
  valkey:
    image: valkey/valkey:8.0
    command: ["valkey-server", "--appendonly", "yes"]   # keep checkpoints across restarts
    ports: ["6379:6379"]
    volumes: ["valkey-data:/data"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4318:4318"]  # OTLP/HTTP, also usable by a backend run outside compose
    depends_on: [jaeger]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"]

  # Alternative trace UI with LLM-aware views of OpenInference spans:
  # phoenix:
  #   image: arizephoenix/phoenix:latest
  #   ports: ["6006:6006"]   # then add an otlphttp/phoenix exporter in otel-collector.yaml

volumes:
  backend-data:
  valkey-data:
