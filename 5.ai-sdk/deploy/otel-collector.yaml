# One pipeline for every framework's spans and metrics.
# On AWS swap the exporter for the ADOT collector's awsxray / awsemf exporters;
# on GCP use the googlecloud exporter (or OTEL_EXPORTER=gcp in the backend).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:  # Claude Code CLI log events (OTEL_LOGS_EXPORTER=otlp)
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
