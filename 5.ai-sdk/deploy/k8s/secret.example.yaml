# Copy to secret.yaml (git-ignored), fill in, then: kubectl apply -f secret.yaml
# PRODUCTION: prefer workload identity (IRSA on EKS, Workload Identity on GKE) over static keys,
# and an external secret store (AWS Secrets Manager / GCP Secret Manager via External Secrets).
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: ai-sdk
type: Opaque
stringData:
  ANTHROPIC_API_KEY: ""
  GOOGLE_API_KEY: ""
  GOOGLE_CLOUD_PROJECT: ""
  AGENTCORE_MEMORY_ID: ""
  BEDROCK_KB_ID: ""
  AGENT_ENGINE_ID: ""
