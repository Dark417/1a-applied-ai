apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: ai-sdk
data:
  RAW_VENDOR: anthropic
  ANTHROPIC_MODEL: claude-opus-5
  GEMINI_MODEL: gemini-2.5-flash
  AWS_REGION: us-east-1
  GOOGLE_CLOUD_LOCATION: us-central1
  DATA_DIR: /app/data/generated
  PLAYWRIGHT_CHROMIUM_PATH: ""
  OTEL_EXPORTER: otlp
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318
  MAX_LLM_CALLS: "20"
  # In-cluster Valkey (redis.yaml) for dev; in production point at ElastiCache / Memorystore.
  REDIS_URL: redis://valkey.ai-sdk:6379/0
