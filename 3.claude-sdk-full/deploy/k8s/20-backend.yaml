apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data
  namespace: claude-sdk-full
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: claude-sdk-full
  labels: { app: backend }
spec:
  replicas: 1   # RWO volume holds sqlite + session transcripts => single pod. Use a SessionStore + Postgres to scale out.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: REGISTRY/claude-sdk-full-backend:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef: { name: backend-secrets }
          volumeMounts:
            - { name: data, mountPath: /app/data/generated }
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: backend-data }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: claude-sdk-full
spec:
  selector: { app: backend }
  ports: [{ port: 80, targetPort: 8000 }]
