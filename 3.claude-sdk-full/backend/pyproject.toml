[project]
name = "claude-sdk-full-backend"
version = "0.1.0"
description = "FastAPI + Claude Agent SDK: orchestrator, subagents, tools, SQLite, RAG, MCP, streaming, evals"
requires-python = ">=3.11"
dependencies = [
    # Agent runtime (bundles the Claude Code CLI binary; no Node needed).
    "claude-agent-sdk>=0.2",
    # Direct Messages API: used by the eval judge and the GeminiEmbedder replacement (VoyageEmbedder stub).
    "anthropic>=1.0",
    "mcp>=1.23,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
# PRODUCTION vector store example. See app/rag/vector_store.py.
chroma = ["chromadb>=0.5"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["eval: needs ANTHROPIC_API_KEY; run with -m eval"]
addopts = "-m 'not eval'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
