[project]
name = "proposal-review-mcp"
version = "0.1.0"
description = "MCP facade over the proposal review backend: rules, documents, and compliance checks"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.23,<2",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
