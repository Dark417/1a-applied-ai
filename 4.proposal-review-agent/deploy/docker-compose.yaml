# Full local stack with the real polyglot storage:
#   Postgres 16 + pgvector (rules, assessments, sessions, memories, chunks)
#   MongoDB 7              (document records; Firestore Mongo-compat in GCP)
#   backend (FastAPI + ADK + dev UI), frontend (Angular via nginx), mcp-server
#
#   cp backend/.env.example backend/.env        # put your GOOGLE_API_KEY in
#   docker compose -f deploy/docker-compose.yaml up --build -d
#   docker compose -f deploy/docker-compose.yaml exec backend python -m app.cli seed
#
#   portal  http://localhost:4200   dev UI  http://localhost:8000/dev-ui/   MCP  http://localhost:8001/mcp
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: compliance
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d compliance"]
      interval: 3s
      retries: 20

  mongo:
    image: mongo:7
    volumes: [mongodata:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 3s
      retries: 20

  backend:
    build: ../backend
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/compliance
      VECTOR_STORE: pgvector
      DOC_STORE: mongo
      MONGO_URL: mongodb://mongo:27017
      BLOB_STORE: local
      BLOB_DIR: /app/data/generated/blobs
      ARTIFACT_DIR: /app/data/generated/artifacts
      SERVICE_TOKENS: local-mcp-token
      CORS_ORIGINS: http://localhost:4200
    volumes: [blobs:/app/data/generated]
    ports: ["8000:8000"]   # published so the ADK dev UI is reachable at /dev-ui
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }

  frontend:
    build: ../frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["4200:8080"]
    depends_on: [backend]

  mcp-server:
    build: ../mcp-server
    environment:
      BACKEND_URL: http://backend:8000
      SERVICE_TOKEN: local-mcp-token
    ports: ["8001:8001"]
    depends_on: [backend]

volumes:
  pgdata:
  mongodata:
  blobs:
