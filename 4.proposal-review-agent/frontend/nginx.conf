# Serves the SPA and proxies /api to the backend so the browser stays same-origin.
# BACKEND_URL is substituted at container start (nginx image envsubst templates).
#   compose:   http://backend:8000
#   Cloud Run: https://backend-xxxx.a.run.app (internal ingress, reached via Direct VPC egress)
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;          # chat attachments are sent inline as base64

    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        # Cloud Run routes by Host, so send the upstream's host, not ours ($proxy_host is the default;
        # stated explicitly because overriding it with $host breaks Cloud Run-to-Cloud Run proxying).
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;      # SNI for https upstreams
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # IAP's signed identity header passes through untouched; the backend verifies it.
        # SSE: no buffering, long reads.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
