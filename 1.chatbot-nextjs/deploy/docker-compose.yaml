# Local end-to-end run: `docker compose -f deploy/docker-compose.yaml up --build` from the project root.
services:
  backend:
    build: ../backend
    env_file: ../backend/.env
    environment:
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports: ["8000:8000"]

  frontend:
    build:
      context: ../frontend
      args:
        # Browser calls the backend directly, so this must be reachable from the host.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
