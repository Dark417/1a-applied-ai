apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: chatbot-nextjs
  labels: { app: backend }
spec:
  replicas: 1   # InMemorySessionService is per-pod; use a DB session service before scaling out.
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: REGISTRY/chatbot-nextjs-backend:latest   # CI sets the tag
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef: { name: backend-secrets }
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: chatbot-nextjs
spec:
  selector: { app: backend }
  ports: [{ port: 80, targetPort: 8000 }]
