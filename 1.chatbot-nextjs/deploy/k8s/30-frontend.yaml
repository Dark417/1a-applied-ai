apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: chatbot-nextjs
  labels: { app: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          # Built with --build-arg NEXT_PUBLIC_API_URL=https://chatbot.example.com/api-root
          image: REGISTRY/chatbot-nextjs-frontend:latest
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /, port: 3000 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: chatbot-nextjs
spec:
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 3000 }]
