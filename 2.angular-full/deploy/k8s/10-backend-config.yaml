apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: angular-full
data:
  MODEL: gemini-2.5-flash
  APP_NAME: angular-full
  CORS_ORIGINS: '["https://assistant.example.com"]'
  LOG_LEVEL: INFO
  SESSION_BACKEND: sqlite
  SESSION_DB_URL: sqlite+aiosqlite:////app/data/generated/sessions.db
  DB_PATH: /app/data/generated/app.db
  EMBEDDER: hashing
  VECTOR_STORE: memory
  # PRODUCTION shape: MCP server is its own Deployment (25-mcp-server.yaml), reached over HTTP.
  MCP_TRANSPORT: http
  MCP_URL: http://mcp-server:8001/mcp
---
# Do NOT commit a real secret. Create it out-of-band:
#   kubectl -n angular-full create secret generic backend-secrets --from-literal=GOOGLE_API_KEY=...
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: angular-full
type: Opaque
stringData:
  GOOGLE_API_KEY: REPLACE_ME
