# Local end-to-end run: `docker compose -f deploy/docker-compose.yaml up --build` from the project root.
# MCP runs as a stdio child of the backend here (simple). See k8s/ for the separate-service shape.
services:
  backend:
    build: ../backend
    env_file: ../backend/.env
    environment:
      SESSION_BACKEND: sqlite          # conversations survive restarts
      MCP_TRANSPORT: stdio
    volumes:
      - backend-data:/app/data/generated
    expose: ["8000"]

  frontend:
    build: ../frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["4200:8080"]
    depends_on: [backend]

volumes:
  backend-data:
